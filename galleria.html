<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galleria — Hanami Club</title>
  <meta name="description" content="Le foto dei raduni Hanami Club a Gallarate.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M16 6c2 3 2 6 0 9-2-3-2-6 0-9zm0 20c-2-3-2-6 0-9 2 3 2 6 0 9zM6 16c3-2 6-2 9 0-3 2-6 2-9 0zm20 0c-3 2-6 2-9 0 3-2 6-2 9 0z' fill='%23f542f5'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAV -->
  <header class="nav" id="top">
    <div class="container nav__inner">
      <a href="index.html" class="logo" aria-label="Hanami Club, vai alla home">
        <span class="logo__text">HANAMI<span>CLUB</span></span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Navigazione principale">
        <a href="index.html#eventi">Eventi</a>
        <a href="galleria.html" aria-current="page">Galleria</a>
        <a href="index.html#club">Il club</a>
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="Apri menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="section gallery" id="galleria">
      <div class="container" id="galleryRoot"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <div>
        <a href="index.html" class="logo">
          <span class="logo__text">HANAMI<span>CLUB</span></span>
        </a>
        <p class="footer__tag">Raduni statici.</p>
      </div>
      <nav class="footer__links" aria-label="Link footer">
        <a href="index.html#eventi">Eventi</a>
        <a href="galleria.html" aria-current="page">Galleria</a>
        <a href="index.html#club">Il club</a>
      </nav>
    </div>
    <div class="container footer__bottom">
      <span>© <span id="year"></span> Hanami Club. Tutti i diritti riservati.</span>
      <a href="#top">Torna su ↑</a>
    </div>
  </footer>

  <!-- VISORE -->
  <dialog class="viewer" id="viewer" aria-label="Foto">
    <button class="viewer__btn viewer__close" type="button" aria-label="Chiudi">×</button>
    <figure class="viewer__stage">
      <img class="viewer__img" id="viewerImg" alt="">
    </figure>
    <button class="viewer__btn viewer__prev" type="button" aria-label="Foto precedente">‹</button>
    <button class="viewer__btn viewer__next" type="button" aria-label="Foto successiva">›</button>
    <p class="viewer__count" id="viewerCount" aria-live="polite"></p>
  </dialog>

  <script src="js/nav.js"></script>
  <script src="js/eventi.js"></script>
  <script src="js/foto.js"></script>
  <script src="js/galleria.js"></script>
</body>
</html>
